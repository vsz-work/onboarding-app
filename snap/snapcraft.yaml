name: onboarding-app
base: core24
version: "0.1"
summary: Tiny Flask + PostgreSQL visit counter for learning Juju deployments
description: |
  Minimal Flask app that records visits in PostgreSQL.
grade: stable
confinement: strict

platforms:
  amd64:

parts:
  python-deps:
    plugin: python
    source: snap/local/python-deps
    python-requirements: [requirements.txt]
    python-packages: [gunicorn]
    override-pull: |
      craftctl default
      cp "$CRAFT_PROJECT_DIR/requirements.txt" .

  app:
    plugin: dump
    source: .
    organize:
      app.py: app/app.py
      migrate.py: app/migrate.py
    stage:
      - app/app.py
      - app/migrate.py
