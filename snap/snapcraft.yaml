name: onboarding-app
base: core24
version: "0.1"
summary: Tiny Flask + PostgreSQL visit counter for learning Juju deployments
description: |
  Minimal Flask app that records visits in PostgreSQL, served by gunicorn
  on port 8000. Point it at a database with:

    sudo snap set onboarding-app db-uri=postgresql://user:pass@host:5432/db

  then create the schema with `sudo onboarding-app.migrate`.
grade: stable
confinement: strict

platforms:
  amd64:

apps:
  server:
    command: bin/run-server
    daemon: simple
    # Stays disabled until the configure hook sees a db-uri.
    install-mode: disable
    restart-condition: on-failure
    plugs: [network, network-bind]
  migrate:
    command: bin/run-migrate
    plugs: [network]

parts:
  python-deps:
    plugin: python
    source: snap/local/python-deps
    python-requirements: [requirements.txt]
    python-packages: [gunicorn]
    override-pull: |
      craftctl default
      cp "$CRAFT_PROJECT_DIR/requirements.txt" .

  app:
    plugin: dump
    source: .
    organize:
      app.py: app/app.py
      migrate.py: app/migrate.py
      snap/local/run-server: bin/run-server
      snap/local/run-migrate: bin/run-migrate
    stage:
      - app/app.py
      - app/migrate.py
      - bin/run-server
      - bin/run-migrate
