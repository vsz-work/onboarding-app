# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: onboarding-app-machine
title: Onboarding App (machine)
summary: Tiny Flask + PostgreSQL visit counter, deployed from a snap.
description: |
  Installs the vsz-onboarding-app snap (attached as a charm resource), connects it
  to PostgreSQL over the postgresql_client interface, runs the schema
  migration and exposes the app on port 8000.

# Documentation:
# https://documentation.ubuntu.com/charmcraft/stable/howto/build-guides/select-platforms/
base: ubuntu@24.04
platforms:
  amd64:

assumes:
  - juju >= 3.6

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

charm-libs:
  - lib: data_platform_libs.data_interfaces
    version: "0"

requires:
  database:
    interface: postgresql_client
    limit: 1

resources:
  app-snap:
    type: file
    filename: vsz-onboarding-app.snap
    description: The vsz-onboarding-app snap built with snapcraft.
